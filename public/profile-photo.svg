<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background & Glowing Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#141A23" />
      <stop offset="100%" stop-color="#0A0E14" />
    </radialGradient>
    <radialGradient id="avatarGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#5B7FFF" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#2DD4BF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#5B7FFF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B7FFF" />
      <stop offset="50%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="accentLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5B7FFF" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#5B7FFF" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Circle Background -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGlow)" stroke="url(#ringGrad)" stroke-width="6" filter="url(#shadow)" />
  
  <!-- Subtle Ambient Glow inside Circle -->
  <circle cx="200" cy="200" r="180" fill="url(#avatarGlow)" />

  <!-- Code Grid Graphic Overlay -->
  <g opacity="0.08" stroke="#E7EBF1" stroke-width="1">
    <line x1="50" y1="100" x2="350" y2="100" />
    <line x1="50" y1="150" x2="350" y2="150" />
    <line x1="50" y1="200" x2="350" y2="200" />
    <line x1="50" y1="250" x2="350" y2="250" />
    <line x1="50" y1="300" x2="350" y2="300" />
    <line x1="100" y1="50" x2="100" y2="350" />
    <line x1="150" y1="50" x2="150" y2="350" />
    <line x1="200" y1="50" x2="200" y2="350" />
    <line x1="250" y1="50" x2="250" y2="350" />
    <line x1="300" y1="50" x2="300" y2="350" />
  </g>

  <!-- Stylized Developer Silhouette Head & Torso -->
  <g id="developerSilhouette">
    <!-- Torso / Shoulders -->
    <path d="M 90 350 C 90 280, 130 250, 200 250 C 270 250, 310 280, 310 350 Z" fill="url(#shirtGrad)" stroke="#232B37" stroke-width="2" />
    <!-- Collar Detail -->
    <path d="M 160 250 L 200 290 L 240 250" fill="none" stroke="url(#accentLineGrad)" stroke-width="3" stroke-linecap="round" />
    
    <!-- Neck -->
    <rect x="175" y="195" width="50" height="60" rx="10" fill="#E2E8F0" opacity="0.9" />
    
    <!-- Head / Face Silhouette -->
    <ellipse cx="200" cy="155" rx="52" ry="62" fill="#F1F5F9" />
    
    <!-- Hair Top -->
    <path d="M 145 150 C 145 95, 170 85, 200 85 C 230 85, 255 95, 255 150 C 255 130, 240 100, 200 100 C 160 100, 145 130, 145 150 Z" fill="#0F172A" />

    <!-- Glasses Frame (Tech Aesthetic) -->
    <g fill="none" stroke="#5B7FFF" stroke-width="4" opacity="0.95">
      <rect x="160" y="138" width="32" height="22" rx="5" fill="#0A0E14" fill-opacity="0.4" />
      <rect x="208" y="138" width="32" height="22" rx="5" fill="#0A0E14" fill-opacity="0.4" />
      <line x1="192" y1="148" x2="208" y2="148" />
    </g>
  </g>

  <!-- Initials Badge Badge Overlay -->
  <g transform="translate(200, 325)">
    <rect x="-45" y="-18" width="90" height="36" rx="18" fill="#0A0E14" stroke="url(#accentLineGrad)" stroke-width="2" />
    <text x="0" y="6" text-anchor="middle" fill="#2DD4BF" font-family="'Space Grotesk', 'Inter', sans-serif" font-weight="700" font-size="16" letter-spacing="2">SM</text>
  </g>
</svg>
